version: "1.0"
models:
  # Choose active cloud provider:
  #   Subscription (no API key, uses your logged-in CLI account):
  #     "claude_code" -> Claude Pro/Max via `claude` CLI (run `claude` once and /login)
  #     "gemini_cli"  -> Google AI Pro via `gemini` CLI (run `gemini` once and sign in with Google)
  #   API key: "deepseek", "anthropic", or "gemini"
  cloud_provider: "claude_code"

  # Tried in order if the primary provider fails or hits its usage limit; Ollama is the last resort
  # "gemini" = Google AI Studio API key (free tier). "gemini_cli" currently fails for
  # personal Google accounts (Google retired Gemini CLI for individuals in favour of Antigravity).
  fallback_providers:
    - "gemini"

  # Subscription CLI models ("sonnet" / "opus" aliases for Claude; empty = Gemini CLI default)
  claude_code_model: "sonnet"
  gemini_cli_model: ""
  cli_timeout_seconds: 600
  
  # Provider Models:
  deepseek_model: "deepseek-chat"
  anthropic_model: "claude-sonnet-5-5"
  gemini_model: "gemini-flash-latest"   # Google alias for the newest Flash model

  # API Key Environment Variables:
  deepseek_api_key_env: "DEEPSEEK_API_KEY"
  anthropic_api_key_env: "ANTHROPIC_API_KEY"
  gemini_api_key_env: "GEMINI_API_KEY"

  # Daily cap across ALL cloud providers (API keys and subscription CLIs); local Ollama is exempt.
  # After the cap, calls fall back to Ollama until midnight UTC.
  daily_token_limit: 150000
  # Cost estimates, USD per 1M [input, output] tokens, matched by provider name prefix
  pricing_usd_per_million:
    deepseek: [1.40, 2.80]
  local_provider: "ollama"
  local_model: "qwen2.5-coder:14b"
  ollama_base_url: "http://localhost:11434"

# Existing KMP apps the agents can work on: `python cli.py new-task "..." --project <name>`.
# Put your own projects in kmp_agent_config.local.yaml (git-ignored); it is merged over this file.
# Empty default_project = work in this repository (self-hosted mode).
default_project: ""
projects: {}
#  myapp:
#    path: "~/code/my-kmp-app"     # git repo root
#    gradle_subdir: ""              # where gradlew / settings.gradle.kts live inside the repo
#    base_branch: "main"            # agent branches are cut from here; never merged automatically
#    target_platforms: ["android", "ios"]
#    gradle_tasks:                  # build verification (fast compile checks, not full `check`)
#      - ":composeApp:compileDebugKotlinAndroid"
#      - ":composeApp:testDebugUnitTest"
#    copy_untracked:                # git-ignored files the build needs, copied into each worktree
#      - "local.properties"
#    allowed_paths:                 # optional: where agents may write (default: composeApp source sets + Gradle files)
#      - "composeApp/src/commonMain/"

kmp:
  target_platforms:
    - "android"
    - "ios"
    - "desktop"
    - "wasmJs"
  ui_framework: "compose_multiplatform_m3"
  di_framework: "koin"

guardrails:
  hitl_plan_approval: true
  hitl_diff_review: true
  owasp_keychain_keystore_enforcement: true
  max_self_healing_iterations: 5
  # Dry runs only: with no gradlew, pretend the build passed instead of failing. Never auto-merged.
  allow_simulated_build: false

paths:
  sessions_dir: ".sessions"
  worktrees_dir: ".worktrees"
  logs_dir: ".logs"
  skills_dir: "skills"
